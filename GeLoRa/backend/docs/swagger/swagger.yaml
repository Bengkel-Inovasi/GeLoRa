info:
  contact: {}
  description: The core API documentation for GeLoRa backend endpoints.
  title: GeLoRa API
  version: "1.0"
paths:
  /auth/refresh:
    post:
      description: Issue a new access and refresh token pair using a valid refresh
        token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.PostRefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh tokens
      tags:
      - Auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return access and refresh tokens
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/adaptersinboundhttpdto.PostSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.PostSignInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      summary: Sign in
      tags:
      - Auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      description: Register a new user and return access and refresh tokens
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/adaptersinboundhttpdto.PostSignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.PostSignUpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      summary: Sign up
      tags:
      - Auth
  /nodes:
    get:
      description: Return a paginated list of nodes with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Cursor ID for pagination
        in: query
        name: cursor_id
        type: integer
      - description: Search by name or MID
        in: query
        name: search
        type: string
      - description: Filter by validation status
        in: query
        name: is_validated
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.GetNodesListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: List nodes
      tags:
      - Nodes
  /nodes/{id}:
    delete:
      description: Permanently remove a node
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete node by ID
      tags:
      - Nodes
    get:
      description: Return the full details of a specific node
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.GetNodeInfoByIdResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Get node by ID
      tags:
      - Nodes
    patch:
      consumes:
      - application/json
      description: Update the name and/or description of a specific node
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/adaptersinboundhttpdto.PatchNodeInfoByIdRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Update node by ID
      tags:
      - Nodes
  /nodes/{id}/validate:
    put:
      description: Mark a node as validated by the currently authenticated user
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Validate node by ID
      tags:
      - Nodes
  /records:
    get:
      description: Return telemetry records with optional filters by session, user,
        node, and time range
      parameters:
      - description: Filter by session ID
        in: query
        name: session_id
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by node ID
        in: query
        name: node_id
        type: integer
      - description: Start of time range (RFC3339, e.g. 2024-01-01T00:00:00Z)
        in: query
        name: start_time
        type: string
      - description: End of time range (RFC3339, e.g. 2024-01-01T23:59:59Z)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.GetRecordsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: List records
      tags:
      - Records
  /sessions:
    get:
      description: Return a paginated list of sessions with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Cursor ID for pagination
        in: query
        name: cursor_id
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by node ID
        in: query
        name: node_id
        type: integer
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.GetSessionsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: List sessions
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      description: Create a new active session for a user on a node
      parameters:
      - description: Session details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/adaptersinboundhttpdto.PostSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.PostSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Start a session
      tags:
      - Sessions
  /sessions/{id}:
    delete:
      description: Permanently remove a session record
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete session by ID
      tags:
      - Sessions
    get:
      description: Return the details of a specific session
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.GetSessionByIdResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
      security:
      - BearerAuth: []
      summary: Get session by ID
      tags:
      - Sessions
  /sessions/end:
    put:
      consumes:
      - application/json
      description: Terminate a session identified by session ID, user ID, or node
        ID (at least one required)
      parameters:
      - description: Session identifier(s)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/adaptersinboundhttpdto.PutSessionEndRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/adaptersinboundhttpdto.CommonErrorResponse'
        "404":
