version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gelora_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # NEXT_PUBLIC_API_URL=https://api.yourdomain.com
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gelora_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Add necessary environment variables here, or pass an env_file
      # - DB_PATH=/app/gelora.db
      # - MQTT_BROKER_URL=tls://xxx.s1.eu.hivemq.cloud:8883
    volumes:
      - gelora_data:/app/database # Assuming the Go app uses sqlite and stores it somewhere, adjust path if needed.

volumes:
  gelora_data:
